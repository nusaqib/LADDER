# Four-window alarm annunciator: latched alarms with a common acknowledge,
# group lamp, horn that re-sounds on every new alarm, and first-out capture
# (which window tripped first). One alarm_group element replaces what is
# usually a page of hand-written rungs.
ir_version: "0.2"
name: Annunciator
description: Alarm annunciator panel with common ack, horn, and first-out capture.

tags:
  # fail-safe sense: 1 = OK / healthy / closed
  - {name: flow_ok,     type: BOOL, direction: input,  comment: Cooling water flow healthy}
  - {name: temp_ok,     type: BOOL, direction: input,  comment: Magnet temperature in range}
  - {name: vacuum_ok,   type: BOOL, direction: input,  comment: Beamline vacuum healthy}
  - {name: door_closed, type: BOOL, direction: input,  comment: Enclosure door closed}
  - {name: ack_pb,      type: BOOL, direction: input,  comment: Alarm acknowledge pushbutton}

  - {name: alarm_lamp,  type: BOOL, direction: output, comment: Group alarm lamp (any latched)}
  - {name: horn,        type: BOOL, direction: output, comment: Alarm horn (any unacknowledged)}
  - {name: flow_lamp,   type: BOOL, direction: output, comment: Window lamp - cooling flow}
  - {name: temp_lamp,   type: BOOL, direction: output, comment: Window lamp - magnet temperature}

  - {name: first_out_code, type: INT, comment: "First-out: 0=none, 1=no_flow, 2=overtemp, 3=vac_fault, 4=door_open"}

programs:
  - name: AlarmPanel
    description: Main annunciator logic.
    logic:
      - element: alarm_group
        id: GRP_panel
        description: Four-window annunciator with first-out capture.
        ack: ack_pb
        active: alarm_lamp
        unacked: horn
        first_out: first_out_code
        alarms:
          - name: no_flow
            condition: {not: flow_ok}
            on_delay: T#2s
            output: flow_lamp
            description: Cooling water flow lost (debounced)
          - name: overtemp
            condition: {not: temp_ok}
            output: temp_lamp
            description: Magnet over temperature
          - name: vac_fault
            condition: {not: vacuum_ok}
            description: Beamline vacuum fault
          - name: door_open
            condition: {not: door_closed}
            description: Enclosure door opened
